name: Build unsigned IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:

      # ============================================
      # Checkout
      # ============================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================
      # Detect and select Xcode 26
      # ============================================

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "RUNNER INFORMATION"
          echo "========================================"

          sw_vers

          echo ""
          echo "Available Xcode installations:"
          ls -ld /Applications/Xcode*.app 2>/dev/null || true

          XCODE_APP=""

          for candidate in /Applications/Xcode*.app; do
            if [ ! -d "$candidate" ]; then
              continue
            fi

            version=$(
              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleShortVersionString" \
                "$candidate/Contents/Info.plist" \
                2>/dev/null || true
            )

            echo ""
            echo "Found:"
            echo "$candidate"
            echo "Version:"
            echo "$version"

            if [[ "$version" == 26.* ]]; then
              XCODE_APP="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_APP" ]; then
            echo ""
            echo "ERROR: No Xcode 26.x installation was found."
            echo ""
            echo "Available Xcode installations:"
            ls -ld /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "SELECTING XCODE"
          echo "========================================"

          echo "$XCODE_APP"

          sudo xcode-select --switch "$XCODE_APP"

          echo ""
          echo "Developer directory:"
          xcode-select --print-path

          echo ""
          echo "Selected Xcode:"
          xcodebuild -version


      # ============================================
      # Ensure matching iOS Simulator runtime exists
      # ------------------------------------------------
      # Even for a DEVICE-ONLY archive build, Xcode's
      # actool cross-checks installed simulator runtimes
      # against the iphonesimulator SDK build version.
      # On some macos-26 runner images the pre-installed
      # runtimes (e.g. 23C54 / 23E254a / 23F77) do not
      # match the SDK actool expects, which makes actool
      # fail the whole archive with:
      #
      #   "No simulator runtime version from [...]
      #    available to use with iphonesimulator SDK
      #    version ..."
      #
      # This is a known runner-image issue
      # (github.com/actions/runner-images issues
      # #13317 / #13275). The fix is to make sure a
      # matching runtime is present on disk before
      # building, even though we never run on a
      # simulator ourselves.
      # ============================================

      - name: Ensure matching iOS Simulator runtime is installed
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SIMULATOR RUNTIMES BEFORE"
          echo "========================================"
          xcrun simctl runtime list || true

          echo ""
          echo "Attempting to download the matching iOS platform/runtime..."
          xcodebuild -downloadPlatform iOS || echo "Download attempt finished (may already be present or unavailable)."

          echo ""
          echo "========================================"
          echo "SIMULATOR RUNTIMES AFTER"
          echo "========================================"
          xcrun simctl runtime list || true


      # ============================================
      # Verify device SDK
      # ============================================

      - name: Verify iOS Device SDK
        shell: bash
        run: |
          set -euo pipefail

          # IMPORTANT: capture xcodebuild's full output BEFORE piping to
          # head. Piping "xcodebuild -version | head -n 1" directly lets
          # head close the pipe after the first line while xcodebuild is
          # still trying to write its second line ("Build version ..."),
          # which raises NSFileHandleOperationException: Broken pipe and
          # aborts the whole process with exit code 134. Capturing the
          # full output first avoids the race entirely.
          XCODE_VERSION_FULL="$(xcodebuild -version)"
          XCODE_VERSION="$(printf '%s\n' "$XCODE_VERSION_FULL" | head -n 1)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "Xcode:"
          echo "$XCODE_VERSION"

          echo ""
          echo "iPhoneOS SDK:"
          echo "$SDK_VERSION"

          echo ""
          echo "SDK path:"
          echo "$SDK_PATH"

          if [[ "$XCODE_VERSION" != Xcode\ 26.* ]]; then
            echo ""
            echo "ERROR: Xcode 26.x is not selected."
            exit 1
          fi

          if [[ ! "$SDK_VERSION" =~ ^26\. ]]; then
            echo ""
            echo "ERROR: iOS 26 SDK is not selected."
            echo "Found: $SDK_VERSION"
            exit 1
          fi

          echo ""
          echo "SUCCESS:"
          echo "Xcode 26 detected."
          echo "iOS 26 device SDK detected."


      # ============================================
      # IMPORTANT:
      # We do NOT build Simulator
      # ============================================

      - name: Verify device-only build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DEVICE ONLY BUILD"
          echo "========================================"

          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          echo ""
          echo "Device SDK path:"
          xcrun --sdk iphoneos --show-sdk-path

          echo ""
          echo "Simulator SDK will NOT be used."


      # ============================================
      # Install XcodeGen
      # ============================================

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen version


      # ============================================
      # Generate project
      # ============================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf iStore.xcodeproj

          xcodegen generate

          if [ ! -d "iStore.xcodeproj" ]; then
            echo "ERROR: iStore.xcodeproj was not generated."
            exit 1
          fi

          echo "Project generated successfully."


      # ============================================
      # Check generated project
      # ============================================

      - name: Inspect generated project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "XCODE VERSION"
          echo "========================================"

          xcodebuild -version

          echo ""
          echo "========================================"
          echo "PROJECT TARGETS"
          echo "========================================"

          xcodebuild \
            -project iStore.xcodeproj \
            -list

          echo ""
          echo "========================================"
          echo "CHECKING FOR SIMULATOR TARGETS"
          echo "========================================"

          if grep -R \
            -E "iStoreUISim|iphonesimulator" \
            iStore.xcodeproj/project.pbxproj; then

            echo ""
            echo "ERROR: Simulator configuration detected."
            exit 1
          fi

          echo "No simulator target/configuration detected."


      # ============================================
      # Build archive
      # ============================================

      - name: Build unsigned device archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/iStore.xcarchive"

          rm -rf "$ARCHIVE_PATH"

          echo "========================================"
          echo "BUILDING iOS DEVICE ARCHIVE"
          echo "========================================"

          xcodebuild \
            -project iStore.xcodeproj \
            -scheme iStore \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            archive


      # ============================================
      # Verify archive
      # ============================================

      - name: Verify archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/iStore.xcarchive"

          APP_PATH="$ARCHIVE_PATH/Products/Applications/iStore.app"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERROR: Archive was not created."
            exit 1
          fi

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iStore.app was not found."
            exit 1
          fi

          echo "Archive:"
          echo "$ARCHIVE_PATH"

          echo ""
          echo "Application:"
          echo "$APP_PATH"

          echo ""
          echo "Executable:"
          file "$APP_PATH/iStore"


      # ============================================
      # Package IPA
      # ============================================

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Payload
          rm -f iStore-unsigned.ipa

          mkdir -p Payload

          cp -R \
            "$RUNNER_TEMP/iStore.xcarchive/Products/Applications/iStore.app" \
            "Payload/iStore.app"

          zip -qry \
            iStore-unsigned.ipa \
            Payload

          if [ ! -f "iStore-unsigned.ipa" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh iStore-unsigned.ipa


      # ============================================
      # Upload IPA
      # ============================================

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iStore-unsigned-ipa
          path: iStore-unsigned.ipa
          if-no-files-found: error
