name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # Select Xcode 26
      # ==================================================

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AVAILABLE XCODE INSTALLATIONS"
          echo "=========================================="

          ls -d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_APP=""

          for candidate in /Applications/Xcode*.app; do
            [ -d "$candidate" ] || continue

            version=$(
              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleShortVersionString" \
                "$candidate/Contents/Info.plist" \
                2>/dev/null || true
            )

            echo ""
            echo "Candidate: $candidate"
            echo "Version:   $version"

            if [[ "$version" == 26.* ]]; then
              XCODE_APP="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_APP" ]; then
            echo ""
            echo "ERROR: Xcode 26 was not found."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "SELECTING XCODE"
          echo "=========================================="

          echo "$XCODE_APP"

          sudo xcode-select -s "$XCODE_APP"

          echo ""
          echo "xcode-select:"
          xcode-select -p

          echo ""
          echo "Xcode version:"
          xcodebuild -version

          echo ""
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          echo ""
          echo "iPhoneOS SDK path:"
          xcrun --sdk iphoneos --show-sdk-path


      # ==================================================
      # Verify Xcode 26
      # ==================================================

      - name: Verify Xcode 26 and iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          XCODE_VERSION="$(xcodebuild -version | head -n 1)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          echo "Xcode:"
          echo "$XCODE_VERSION"

          echo ""
          echo "iOS SDK:"
          echo "$SDK_VERSION"

          if [[ "$XCODE_VERSION" != Xcode\ 26.* ]]; then
            echo ""
            echo "ERROR: Xcode 26 is NOT selected."
            echo "Detected:"
            echo "$XCODE_VERSION"
            exit 1
          fi

          if [[ ! "$SDK_VERSION" =~ ^26\. ]]; then
            echo ""
            echo "ERROR: iOS 26 SDK is NOT selected."
            echo "Detected SDK:"
            echo "$SDK_VERSION"
            exit 1
          fi

          echo ""
          echo "SUCCESS:"
          echo "Xcode 26 selected."
          echo "iOS 26 SDK selected."


      # ==================================================
      # Install XcodeGen
      # ==================================================

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          echo "XcodeGen:"
          xcodegen version


      # ==================================================
      # Generate project
      # ==================================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf iStore.xcodeproj

          xcodegen generate

          if [ ! -d "iStore.xcodeproj" ]; then
            echo "ERROR: Xcode project was not generated."
            exit 1
          fi

          echo ""
          echo "Project generated:"
          ls -ld iStore.xcodeproj


      # ==================================================
      # Verify generated project
      # ==================================================

      - name: Verify generated project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "XCODE VERSION"
          echo "=========================================="

          xcodebuild -version

          echo ""
          echo "=========================================="
          echo "PROJECT FORMAT"
          echo "=========================================="

          grep -E "objectVersion|compatibilityVersion" \
            iStore.xcodeproj/project.pbxproj || true

          echo ""
          echo "=========================================="
          echo "PROJECT TARGETS"
          echo "=========================================="

          xcodebuild \
            -project iStore.xcodeproj \
            -list


      # ==================================================
      # Build device archive ONLY
      # ==================================================

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/iStore.xcarchive"

          rm -rf "$ARCHIVE_PATH"

          echo "=========================================="
          echo "BUILDING DEVICE ARCHIVE"
          echo "=========================================="

          xcodebuild \
            -project iStore.xcodeproj \
            -scheme iStore \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            archive


      # ==================================================
      # Verify archive
      # ==================================================

      - name: Verify archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/iStore.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/iStore.app"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERROR: Archive does not exist."
            exit 1
          fi

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iStore.app was not found."
            exit 1
          fi

          echo "Archive:"
          echo "$ARCHIVE_PATH"

          echo ""
          echo "Application:"
          echo "$APP_PATH"

          echo ""
          echo "Executable architecture:"
          file "$APP_PATH/iStore"


      # ==================================================
      # Create IPA
      # ==================================================

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Payload
          rm -f iStore-unsigned.ipa

          mkdir -p Payload

          cp -R \
            "$RUNNER_TEMP/iStore.xcarchive/Products/Applications/iStore.app" \
            Payload/iStore.app

          zip -qry \
            iStore-unsigned.ipa \
            Payload

          if [ ! -f "iStore-unsigned.ipa" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          ls -lh iStore-unsigned.ipa


      # ==================================================
      # Upload
      # ==================================================

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iStore-unsigned-ipa
          path: iStore-unsigned.ipa
          if-no-files-found: error
