name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Xcode 26
      # --------------------------------------------------

      - name: Select Xcode 26
        shell: bash
        run: |
          set -e

          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          echo ""
          echo "Current Xcode:"
          xcodebuild -version

          # macOS 26 GitHub runner uses Xcode 26 by default.
          sudo xcode-select -s /Applications/Xcode.app

          echo ""
          echo "Selected Xcode:"
          xcodebuild -version

          echo ""
          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-version


      # --------------------------------------------------
      # XcodeGen
      # --------------------------------------------------

      - name: Install XcodeGen
        run: |
          brew install xcodegen


      # --------------------------------------------------
      # Generate Xcode project
      # --------------------------------------------------

      - name: Generate Xcode project
        run: |
          set -e

          xcodegen generate

          echo "Generated project:"
          ls -la

          test -d "iStore.xcodeproj"

          echo "iStore.xcodeproj generated successfully."


      # --------------------------------------------------
      # Show project information
      # --------------------------------------------------

      - name: Check project and schemes
        run: |
          set -e

          xcodebuild \
            -project iStore.xcodeproj \
            -list


      # --------------------------------------------------
      # Verify iOS SDK
      # --------------------------------------------------

      - name: Verify iOS 26 SDK
        run: |
          set -e

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)

          echo "iPhoneOS SDK:"
          echo "$SDK_PATH"

          echo "SDK Version:"
          echo "$SDK_VERSION"

          if [[ "$SDK_VERSION" != 26.* ]]; then
            echo "ERROR: Xcode 26 / iOS 26 SDK was not selected."
            exit 1
          fi


      # --------------------------------------------------
      # Build unsigned archive
      # --------------------------------------------------

      - name: Build unsigned archive
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/iStore.xcarchive"

          xcodebuild \
            -project iStore.xcodeproj \
            -scheme iStore \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iStore.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive


      # --------------------------------------------------
      # Verify archive
      # --------------------------------------------------

      - name: Verify archive
        run: |
          set -e

          ARCHIVE="$RUNNER_TEMP/iStore.xcarchive"
          APP="$ARCHIVE/Products/Applications/iStore.app"

          test -d "$ARCHIVE"
          test -d "$APP"

          echo "Archive:"
          echo "$ARCHIVE"

          echo "Application:"
          echo "$APP"

          echo ""
          echo "App bundle:"
          ls -la "$APP"


      # --------------------------------------------------
      # Create IPA
      # --------------------------------------------------

      - name: Package IPA
        run: |
          set -e

          rm -rf Payload
          rm -f iStore-unsigned.ipa

          mkdir -p Payload

          cp -R \
            "$RUNNER_TEMP/iStore.xcarchive/Products/Applications/iStore.app" \
            "Payload/iStore.app"

          zip -qry \
            iStore-unsigned.ipa \
            Payload

          test -f iStore-unsigned.ipa

          echo ""
          echo "IPA created:"
          ls -lh iStore-unsigned.ipa


      # --------------------------------------------------
      # Upload IPA
      # --------------------------------------------------

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iStore-unsigned-ipa
          path: iStore-unsigned.ipa
          if-no-files-found: error
