name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -f iStore.xcodeproj/project.pbxproj

      - name: Show available schemes
        run: |
          xcodebuild \
            -project iStore.xcodeproj \
            -list

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project iStore.xcodeproj \
            -scheme iStore \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iStore.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Verify archive
        run: |
          test -d "$RUNNER_TEMP/iStore.xcarchive"
          test -d "$RUNNER_TEMP/iStore.xcarchive/Products/Applications/iStore.app"

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R \
            "$RUNNER_TEMP/iStore.xcarchive/Products/Applications/iStore.app" \
            Payload/iStore.app

          zip -qry iStore-unsigned.ipa Payload

          test -f iStore-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iStore-unsigned-ipa
          path: iStore-unsigned.ipa
          if-no-files-found: error
