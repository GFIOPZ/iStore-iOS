name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select installed Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_APP=""

          for candidate in /Applications/Xcode*.app; do
            [ -d "$candidate" ] || continue

            version=$(
              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleShortVersionString" \
                "$candidate/Contents/Info.plist" \
                2>/dev/null || true
            )

            echo "$candidate -> $version"

            if [[ "$version" == 26.* ]]; then
              XCODE_APP="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_APP" ]; then
            echo "ERROR: No Xcode 26.x installation was found."
            exit 1
          fi

          echo "Using:"
          echo "$XCODE_APP"

          sudo xcode-select --switch "$XCODE_APP"

          echo ""
          echo "Selected Xcode:"
          xcodebuild -version

          echo ""
          echo "Developer directory:"
          xcode-select -p

      - name: Verify iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          XCODE_VERSION="$(xcodebuild -version | head -n 1)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "Xcode:"
          echo "$XCODE_VERSION"

          echo ""
          echo "iPhoneOS SDK:"
          echo "$SDK_VERSION"

          echo ""
          echo "SDK path:"
          echo "$SDK_PATH"

          if [[ "$XCODE_VERSION" != Xcode\ 26.* ]]; then
            echo "ERROR: Xcode 26.x is not selected."
            exit 1
          fi

          if [[ ! "$SDK_VERSION" =~ ^26\. ]]; then
            echo "ERROR: iOS 26 SDK is not selected."
            echo "Detected SDK: $SDK_VERSION"
            exit 1
          fi

          echo ""
          echo "Xcode 26 + iOS 26 SDK verified."

      - name: Show installed platforms
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed SDKs:"
          xcodebuild -showsdks

          echo ""
          echo "iOS device SDK:"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf iStore.xcodeproj

          xcodegen generate

          test -d iStore.xcodeproj

          echo "Project generated successfully."

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "Project:"
          xcodebuild \
            -project iStore.xcodeproj \
            -list

      - name: Build unsigned IPA archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/iStore.xcarchive"

          rm -rf "$ARCHIVE_PATH"

          xcodebuild \
            -project iStore.xcodeproj \
            -scheme iStore \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            archive

      - name: Verify archive
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/iStore.xcarchive/Products/Applications/iStore.app"

          test -d "$APP_PATH"

          echo "Archive successfully created:"
          echo "$APP_PATH"

          file "$APP_PATH/iStore"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Payload
          rm -f iStore-unsigned.ipa

          mkdir Payload

          cp -R \
            "$RUNNER_TEMP/iStore.xcarchive/Products/Applications/iStore.app" \
            Payload/iStore.app

          zip -qry iStore-unsigned.ipa Payload

          ls -lh iStore-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iStore-unsigned-ipa
          path: iStore-unsigned.ipa
          if-no-files-found: error
